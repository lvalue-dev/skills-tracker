name: Daily skills report

on:
  schedule:
    - cron: "23 23 * * *" # 매일 08:23 KST (UTC 23:23)
  workflow_dispatch:

# 이 레포에만 커밋한다. 다른 레포에는 읽기(검색 GET · 공개 클론)만 한다.
permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          pip install -q -r requirements.txt

      - name: Self-test the checker
        run: python -m unittest discover -s tests

      - name: Collect, test and build report
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(TZ=Asia/Seoul date +%F)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          python -m tracker --date "$date"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "report: ${{ steps.build.outputs.date }} 일일 스킬 리포트"
            git push
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: skills-report-${{ steps.build.outputs.date }}
          path: reports/${{ steps.build.outputs.date }}.pdf
          if-no-files-found: error
