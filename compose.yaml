# 홈서버 실행: docker compose up -d --build
services:
  tracker:
    build: .
    image: skills-tracker:local
    restart: unless-stopped
    # 리포트 파일이 호스트 사용자 소유로 남도록 호스트의 UID:GID 로 실행한다 (.env 에서 변경).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      RUN_AT: "${RUN_AT:-08:23}" # 매일 실행 시각 (config.json 의 timezone 기준, 기본 Asia/Seoul)
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}" # 선택. 없어도 동작한다 (검색 조회에만 사용)
      # 선택. 키가 있으면 사람이 쓴 요약이 없는 레포의 한글 요약을 LLM 으로 만든다 (OpenAI 호환 API).
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-z-ai/glm-5.3-flash}"
    # 홈서버 결과물은 git 이 관리하지 않는 폴더(기본 ./output)에 쌓는다.
    # 레포의 data/·reports/ 에 쓰면 GitHub 쪽 리포트 커밋과 겹쳐 `git pull` 이 실패한다.
    volumes:
      - ${OUTPUT_DIR:-./output}/data:/app/data
      - ${OUTPUT_DIR:-./output}/reports:/app/reports
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # 리포트 웹 보기: http://<홈서버 주소>:8080 (날짜별 목록 → 웹 리포트 · PDF)
  # 인증이 없으니 공유기 포트포워딩으로 외부에 열지 말고 집 안 네트워크에서만 쓴다.
  web:
    build: .
    image: skills-tracker:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "-m", "http.server", "8080", "--directory", "/app/reports"]
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ${OUTPUT_DIR:-./output}/reports:/app/reports:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
